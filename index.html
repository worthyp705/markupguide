<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Material Markup Calculator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="p-4 flex justify-center">
  <div id="root" class="w-full max-w-md"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    function Calculator() {
      const [costInput, setCostInput] = useState('');
      const [customMarkup, setCustomMarkup] = useState(null);

      const cost = parseFloat(costInput) || 0;

      // Muskoka T&M Sliding Scale
      const defaultTier = useMemo(() => {
        if (cost <= 0) return { pct: 50, label: "T&M Baseline", desc: "Standard 50% baseline" };
        if (cost <= 50) return { pct: 100, label: "Tier 1 (< $50)", desc: "Small parts, valves, loose fittings (100%)" };
        if (cost <= 250) return { pct: 50, label: "Tier 2 ($50 - $250)", desc: "Couplings, System 636, tank tee kits (50%)" };
        if (cost <= 750) return { pct: 45, label: "Tier 3 ($250 - $750)", desc: "Pressure tanks, bulk fittings (45%)" };
        if (cost <= 1500) return { pct: 35, label: "Tier 4 ($750 - $1,500)", desc: "Submersible pumps, softeners (35%)" };
        return { pct: 25, label: "Tier 5 ($1,500+)", desc: "Water heaters, boilers, heat-lines (25%)" };
      }, [cost]);

      const activeMarkup = customMarkup !== null ? customMarkup : defaultTier.pct;

      const markupDollars = cost * (activeMarkup / 100);
      const billedPreTax = cost + markupDollars;
      const ccFee = billedPreTax * 0.029; // 2.9% credit card merchant fee
      const netCashProfit = markupDollars - ccFee;
      const hst = billedPreTax * 0.13;
      const totalWithTax = billedPreTax + hst;

      const buttonOptions = [25, 35, 40, 50, 60, 75, 100];

      return (
        <div class="space-y-4 pb-8">
          <div class="flex items-center justify-between border-b border-slate-700 pb-3">
            <div>
              <h1 class="text-xl font-bold tracking-tight text-white">T&M Material Calculator</h1>
              <p class="text-xs text-slate-400">Muskoka Solo Trade Scale</p>
            </div>
            <span class="bg-blue-600/30 text-blue-400 text-xs px-2.5 py-1 rounded-full font-semibold border border-blue-500/30">
              T&M Active
            </span>
          </div>

          {/* Cost Input */}
          <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-sm">
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
              Your Cost (Pre-Tax CAD)
            </label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-2xl font-bold text-slate-400">$</span>
              <input
                type="number"
                step="0.01"
                placeholder="0.00"
                value={costInput}
                onChange={(e) => {
                  setCostInput(e.target.value);
                  setCustomMarkup(null);
                }}
                class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 pl-8 pr-4 text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            {cost > 0 && (
              <p class="text-xs text-blue-400 mt-2 font-medium">
                Auto-assigned: {defaultTier.label} &bull; {defaultTier.desc}
              </p>
            )}
          </div>

          {/* Quick Markup Adjust Buttons */}
          <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs text-slate-400 font-medium">Select or Adjust Markup</span>
              <span class="text-xs font-bold text-blue-400">{activeMarkup}% Markup</span>
            </div>
            <div class="grid grid-cols-4 sm:grid-cols-7 gap-1.5">
              {buttonOptions.map((pct) => (
                <button
                  key={pct}
                  onClick={() => setCustomMarkup(pct)}
                  class={`py-2.5 rounded-lg text-xs font-bold transition-colors ${
                    activeMarkup === pct
                      ? 'bg-blue-600 text-white ring-2 ring-blue-400'
                      : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                  }`}
                >
                  {pct}%
                </button>
              ))}
            </div>
          </div>

          {/* Result Card */}
          <div class="bg-blue-950/40 border border-blue-500/40 p-4 rounded-xl space-y-3">
            <div>
              <span class="text-xs uppercase text-slate-400 tracking-wider">Bill to Client (Pre-Tax)</span>
              <div class="text-3xl font-extrabold text-green-400">
                ${billedPreTax.toFixed(2)}
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700/60 text-xs">
              <div>
                <span class="text-slate-400">Gross Markup:</span>
                <p class="font-bold text-slate-200">+${markupDollars.toFixed(2)}</p>
              </div>
              <div>
                <span class="text-slate-400">Net Profit (After CC):</span>
                <p class="font-bold text-green-400">${netCashProfit.toFixed(2)}</p>
              </div>
              <div>
                <span class="text-slate-400">Card Fee (2.9%):</span>
                <p class="font-semibold text-rose-400">-${ccFee.toFixed(2)}</p>
              </div>
              <div>
                <span class="text-slate-400">Total with 13% HST:</span>
                <p class="font-bold text-white">${totalWithTax.toFixed(2)}</p>
              </div>
            </div>
          </div>

          {/* Clean Invoice Line Suggestion */}
          {cost > 0 && (
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg text-xs space-y-1">
              <span class="text-slate-400 font-semibold uppercase tracking-wider block">Suggested Invoice Line</span>
              <p class="text-slate-300 font-mono">
                Plumbing materials & connection hardware: ${billedPreTax.toFixed(2)} + HST
              </p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Calculator />);
  </script>
</body>
</html>
