<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Worthy Plumbing Calculator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="p-4 flex justify-center">
  <div id="root" class="w-full max-w-md"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    function Calculator() {
      const [pipeMode, setPipeMode] = useState('none'); // 'none', 'wirsbo', 'abs', 'copper'
      const [costInput, setCostInput] = useState('');
      const [lengthInput, setLengthInput] = useState('20');
      const [customMarkup, setCustomMarkup] = useState(null);

      const baseCost = parseFloat(costInput) || 0;
      const length = parseFloat(lengthInput) || 0;
      const totalCost = (pipeMode !== 'none') ? (baseCost * length) : baseCost;

      // Independent Logic for Each Pipe Material
      const defaultTier = useMemo(() => {
        if (pipeMode === 'wirsbo') {
          if (baseCost <= 0) return { pct: 250, tier: "Wirsbo / PEX", desc: "Enter cost per foot below" };
          if (baseCost < 1.00) return { pct: 250, tier: "1/2\" Wirsbo (< $1.00/ft)", desc: "Small-bore PEX standard (250%)" };
          return { pct: 150, tier: "3/4\"+ Wirsbo ($1.00+/ft)", desc: "Mid-bore PEX standard (150%)" };
        }
        
        if (pipeMode === 'abs') {
          if (baseCost <= 0) return { pct: 100, tier: "ABS / PVC Pipe", desc: "Enter cost per foot below" };
          return { pct: 100, tier: "ABS Pipe", desc: "Standard 1-1/2\" to 3\" ABS (100%)" };
        }

        if (pipeMode === 'copper') {
          if (baseCost <= 0) return { pct: 75, tier: "Copper Pipe", desc: "Enter cost per foot below" };
          if (baseCost < 8.00) return { pct: 75, tier: "1/2\" & 3/4\" Copper", desc: "Small-bore copper standard (75%)" };
          return { pct: 60, tier: "1\"+ Copper", desc: "Large-bore copper standard (60%)" };
        }
        
        // Standard non-pipe rules
        if (totalCost <= 0) return { pct: 60, tier: "General Parts", desc: "Enter your total cost below" };
        if (totalCost <= 10.00) return { pct: 300, tier: "Micro-Parts (< $10)", desc: "Single fittings, adapters (300%)" };
        if (totalCost <= 50.00) return { pct: 100, tier: "Tier 1 ($10 - $50)", desc: "Small parts, valves, loose fittings (100%)" };
        if (totalCost <= 250.00) return { pct: 60, tier: "Tier 2 ($50 - $250)", desc: "Couplings, System 636, tank tee kits (60%)" };
        if (totalCost <= 750.00) return { pct: 50, tier: "Tier 3 ($250 - $750)", desc: "Pressure tanks, bulk fittings (50%)" };
        if (totalCost <= 1500.00) return { pct: 35, tier: "Tier 4 ($750 - $1,500)", desc: "Submersible pumps, softeners (35%)" };
        return { pct: 30, tier: "Tier 5 ($1,500+)", desc: "Water heaters, boilers, heat-lines (30%)" };
      }, [totalCost, baseCost, pipeMode]);

      const activeMarkup = customMarkup !== null ? customMarkup : defaultTier.pct;

      const markupDollars = totalCost * (activeMarkup / 100);
      const billedPreTax = totalCost + markupDollars;
      const marginPct = billedPreTax > 0 ? (markupDollars / billedPreTax) * 100 : 0;
      const hst = billedPreTax * 0.13;
      const totalWithTax = billedPreTax + hst;
      const pricePerFootBilled = (pipeMode !== 'none') && length > 0 ? (billedPreTax / length) : 0;

      const buttonOptions = [35, 50, 60, 75, 100, 125, 150, 200, 250, 300];

      return (
        <div class="space-y-4 pb-8">
          {/* Header */}
          <div class="flex items-center justify-between border-b border-slate-700 pb-3">
            <div>
              <h1 class="text-xl font-bold tracking-tight text-white">Worthy Plumbing Calculator</h1>
            </div>
          </div>

          {/* Dedicated Material Toggles */}
          <div class="bg-slate-800/80 p-2 rounded-xl border border-slate-700 grid grid-cols-2 gap-2 sm:grid-cols-4">
             <button 
              onClick={() => { setPipeMode('none'); setCustomMarkup(null); setCostInput(''); }}
              class={`py-2 rounded-lg text-xs font-bold transition-colors ${pipeMode === 'none' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'}`}
            >
              Parts
            </button>
            <button 
              onClick={() => { setPipeMode('wirsbo'); setCustomMarkup(null); setCostInput(''); setLengthInput('20'); }}
              class={`py-2 rounded-lg text-xs font-bold transition-colors ${pipeMode === 'wirsbo' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'}`}
            >
              Wirsbo
            </button>
            <button 
              onClick={() => { setPipeMode('abs'); setCustomMarkup(null); setCostInput(''); setLengthInput('12'); }}
              class={`py-2 rounded-lg text-xs font-bold transition-colors ${pipeMode === 'abs' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'}`}
            >
              ABS
            </button>
             <button 
              onClick={() => { setPipeMode('copper'); setCustomMarkup(null); setCostInput(''); setLengthInput('12'); }}
              class={`py-2 rounded-lg text-xs font-bold transition-colors ${pipeMode === 'copper' ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-300'}`}
            >
              Copper
            </button>
          </div>

          {/* Input Section */}
          <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-sm space-y-4">
            {pipeMode !== 'none' ? (
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Cost Per Foot
                  </label>
                  <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-lg font-bold text-slate-400">$</span>
                    <input
                      type="number"
                      step="0.001"
                      placeholder={pipeMode === 'wirsbo' ? '0.60' : pipeMode === 'abs' ? '2.68' : '4.90'}
                      value={costInput}
                      onChange={(e) => { setCostInput(e.target.value); setCustomMarkup(null); }}
                      class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2.5 pl-7 pr-3 text-lg font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Length (ft)
                  </label>
                  <input
                    type="number"
                    step="1"
                    placeholder={pipeMode === 'wirsbo' ? '20' : '12'}
                    value={lengthInput}
                    onChange={(e) => { setLengthInput(e.target.value); setCustomMarkup(null); }}
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg py-2.5 px-3 text-lg font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>
            ) : (
              <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                  Total Cost (Pre-Tax CAD)
                </label>
                <div class="relative">
                  <span class="absolute left-3 top-1/2 -translate-y-1/2 text-2xl font-bold text-slate-400">$</span>
                  <input
                    type="number"
                    step="0.01"
                    placeholder="0.00"
                    value={costInput}
                    onChange={(e) => { setCostInput(e.target.value); setCustomMarkup(null); }}
                    class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 pl-8 pr-4 text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>
            )}
            
            {totalCost > 0 && (
              <p class="text-xs text-blue-400 font-medium border-t border-slate-700 pt-3">
                Auto-assigned: {defaultTier.tier} &bull; {defaultTier.desc}
              </p>
            )}
          </div>

          {/* Markup % Selector Buttons */}
          <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs text-slate-400 font-medium">Markup Percentage</span>
              <span class="text-xs font-bold text-blue-400">{activeMarkup}% Selected</span>
            </div>
            <div class="grid grid-cols-5 gap-1.5">
              {buttonOptions.map((pct) => (
                <button
                  key={pct}
                  onClick={() => setCustomMarkup(pct)}
                  class={`py-2.5 rounded-lg text-xs font-bold transition-colors ${
                    activeMarkup === pct
                      ? 'bg-blue-600 text-white ring-2 ring-blue-400'
                      : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                  }`}
                >
                  {pct}%
                </button>
              ))}
            </div>
          </div>

          {/* Result Card */}
          <div class="bg-blue-950/40 border border-blue-500/40 p-4 rounded-xl space-y-3">
            <div class="flex justify-between items-end">
              <div>
                <span class="text-xs uppercase text-slate-400 tracking-wider">Bill to Client (Pre-Tax)</span>
                <div class="text-3xl font-extrabold text-green-400">
                  ${billedPreTax.toFixed(2)}
                </div>
              </div>
              {pipeMode !== 'none' && length > 0 && (
                <div class="text-right">
                  <span class="text-[11px] uppercase text-slate-400 block">Billed Rate</span>
                  <span class="text-lg font-bold text-blue-400">${pricePerFootBilled.toFixed(2)}/ft</span>
                </div>
              )}
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700/60 text-xs">
              <div>
                <span class="text-slate-400">Your Base Cost:</span>
                <p class="font-semibold text-slate-300">${totalCost.toFixed(2)}</p>
              </div>
              <div>
                <span class="text-slate-400">Markup Profit:</span>
                <p class="font-bold text-green-400">+${markupDollars.toFixed(2)}</p>
              </div>
              <div>
                <span class="text-slate-400">Gross Margin:</span>
                <p class="font-semibold text-slate-200">{marginPct.toFixed(1)}%</p>
              </div>
              <div>
                <span class="text-slate-400">Total with 13% HST:</span>
                <p class="font-bold text-white">${totalWithTax.toFixed(2)}</p>
              </div>
            </div>
          </div>

          {/* Clean Invoice Line Display */}
          {totalCost > 0 && (
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg text-xs space-y-1">
              <p class="text-slate-300 font-mono">
                {pipeMode !== 'none' ? 
                  `${pipeMode === 'wirsbo' ? 'Wirsbo/PEX' : pipeMode === 'abs' ? 'ABS' : 'Copper'} Piping (${length}ft @ $${pricePerFootBilled.toFixed(2)}/ft): $${billedPreTax.toFixed(2)} + HST` : 
                  `Plumbing materials & hardware: $${billedPreTax.toFixed(2)} + HST`
                }
              </p>
            </div>
          )}

          {/* Tier Reference Cheat Sheet */}
          <div class="bg-slate-850 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-400 space-y-1.5">
            <span class="font-bold text-slate-300 block uppercase tracking-wider text-[10px]">Pipe Tiers</span>
            <div class="flex justify-between"><span>1/2" Wirsbo / PEX:</span> <span class="font-semibold text-slate-300">250%</span></div>
            <div class="flex justify-between"><span>3/4" Wirsbo / PEX:</span> <span class="font-semibold text-slate-300">150%</span></div>
            <div class="flex justify-between"><span>ABS (All Sizes):</span> <span class="font-semibold text-slate-300">100%</span></div>
            <div class="flex justify-between"><span>1/2" & 3/4" Copper:</span> <span class="font-semibold text-slate-300">75%</span></div>
            <div class="flex justify-between"><span>1"+ Copper:</span> <span class="font-semibold text-slate-300">60%</span></div>
            <div class="border-t border-slate-700 my-1"></div>
            <span class="font-bold text-slate-300 block uppercase tracking-wider text-[10px]">General Tiers</span>
            <div class="flex justify-between"><span>Micro-Parts (&lt; $10):</span> <span class="font-semibold text-slate-300">300%</span></div>
            <div class="flex justify-between"><span>Tier 1 ($10 – $50):</span> <span class="font-semibold text-slate-300">100%</span></div>
            <div class="flex justify-between"><span>Tier 2 ($50 – $250):</span> <span class="font-semibold text-slate-300">60%</span></div>
            <div class="flex justify-between"><span>Tier 3 ($250 – $750):</span> <span class="font-semibold text-slate-300">50%</span></div>
            <div class="flex justify-between"><span>Tier 4 ($750 – $1,500):</span> <span class="font-semibold text-slate-300">35%</span></div>
            <div class="flex justify-between"><span>Tier 5 ($1,500+):</span> <span class="font-semibold text-slate-300">30%</span></div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Calculator />);
  </script>
</body>
</html>
