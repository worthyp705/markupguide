<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Material Markup Calculator</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="p-4 flex justify-center">
  <div id="root" class="w-full max-w-md"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    function Calculator() {
      const [costInput, setCostInput] = useState('');
      const [customMarkup, setCustomMarkup] = useState(null);

      const cost = parseFloat(costInput) || 0;

      // Muskoka T&M 6-Tier Sliding Scale (Updated for Micro-Parts)
      const defaultTier = useMemo(() => {
        if (cost <= 0) return { pct: 50, tier: "Standard", desc: "Enter your cost below" };
        if (cost <= 10.00) return { pct: 300, tier: "Micro-Parts (< $10)", desc: "Single fittings, adapters (300%)" };
        if (cost <= 50.00) return { pct: 100, tier: "Tier 1 ($10 - $50)", desc: "Small parts, valves, loose fittings (100%)" };
        if (cost <= 250.00) return { pct: 50, tier: "Tier 2 ($50 - $250)", desc: "Couplings, System 636, tank tee kits (50%)" };
        if (cost <= 750.00) return { pct: 45, tier: "Tier 3 ($250 - $750)", desc: "Pressure tanks, bulk fittings lots (45%)" };
        if (cost <= 1500.00) return { pct: 35, tier: "Tier 4 ($750 - $1,500)", desc: "Submersible pumps, softeners (35%)" };
        return { pct: 25, tier: "Tier 5 ($1,500+)", desc: "Water heaters, boilers, heat-lines (25%)" };
      }, [cost]);

      const activeMarkup = customMarkup !== null ? customMarkup : defaultTier.pct;

      // Straightforward Markup Math (No Credit Card Fees)
      const markupDollars = cost * (activeMarkup / 100);
      const billedPreTax = cost + markupDollars;
      const marginPct = billedPreTax > 0 ? (markupDollars / billedPreTax) * 100 : 0;
      const hst = billedPreTax * 0.13;
      const totalWithTax = billedPreTax + hst;

      const buttonOptions = [25, 35, 45, 50, 75, 100, 200, 300, 400];

      return (
        <div class="space-y-4 pb-8">
          {/* Header */}
          <div class="flex items-center justify-between border-b border-slate-700 pb-3">
            <div>
              <h1 class="text-xl font-bold tracking-tight text-white">Worthy Plumbing Calculator</h1>
              <p class="text-xs text-slate-400">Muskoka Trade Sliding Scale</p>
            </div>
            <span class="bg-blue-600/30 text-blue-400 text-xs px-2.5 py-1 rounded-full font-semibold border border-blue-500/30">
              Cash / E-Transfer
            </span>
          </div>

          {/* Wholesale Cost Input */}
          <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 shadow-sm">
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
              Your Cost (Pre-Tax CAD)
            </label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-2xl font-bold text-slate-400">$</span>
              <input
                type="number"
                step="0.01"
                placeholder="0.00"
                value={costInput}
                onChange={(e) => {
                  setCostInput(e.target.value);
                  setCustomMarkup(null);
                }}
                class="w-full bg-slate-900 border border-slate-600 rounded-lg py-3 pl-8 pr-4 text-2xl font-bold text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
            {cost > 0 && (
              <p class="text-xs text-blue-400 mt-2 font-medium">
                Auto-assigned: {defaultTier.tier} &bull; {defaultTier.desc}
              </p>
            )}
          </div>

          {/* Markup % Selector Buttons */}
          <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700">
            <div class="flex justify-between items-center mb-2">
              <span class="text-xs text-slate-400 font-medium">Markup Percentage</span>
              <span class="text-xs font-bold text-blue-400">{activeMarkup}% Selected</span>
            </div>
            <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5">
              {buttonOptions.map((pct) => (
                <button
                  key={pct}
                  onClick={() => setCustomMarkup(pct)}
                  class={`py-2.5 rounded-lg text-xs font-bold transition-colors ${
                    activeMarkup === pct
                      ? 'bg-blue-600 text-white ring-2 ring-blue-400'
                      : 'bg-slate-700 text-slate-300 hover:bg-slate-600'
                  }`}
                >
                  {pct}%
                </button>
              ))}
            </div>
          </div>

          {/* Result Card */}
          <div class="bg-blue-950/40 border border-blue-500/40 p-4 rounded-xl space-y-3">
            <div>
              <span class="text-xs uppercase text-slate-400 tracking-wider">Bill to Client (Pre-Tax)</span>
              <div class="text-3xl font-extrabold text-green-400">
                ${billedPreTax.toFixed(2)}
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-700/60 text-xs">
              <div>
                <span class="text-slate-400">Your Base Cost:</span>
                <p class="font-semibold text-slate-300">${cost.toFixed(2)}</p>
              </div>
              <div>
                <span class="text-slate-400">Markup Profit:</span>
                <p class="font-bold text-green-400">+${markupDollars.toFixed(2)}</p>
              </div>
              <div>
                <span class="text-slate-400">Gross Margin:</span>
                <p class="font-semibold text-slate-200">{marginPct.toFixed(1)}%</p>
              </div>
              <div>
                <span class="text-slate-400">Total with 13% HST:</span>
                <p class="font-bold text-white">${totalWithTax.toFixed(2)}</p>
              </div>
            </div>
          </div>

          {/* Invoice Suggestion */}
          {cost > 0 && (
            <div class="bg-slate-900 border border-slate-800 p-3 rounded-lg text-xs space-y-1">
              <span class="text-slate-400 font-semibold uppercase tracking-wider block">Suggested Invoice Line</span>
              <p class="text-slate-300 font-mono">
                Plumbing materials & connection hardware: ${billedPreTax.toFixed(2)} + HST
              </p>
            </div>
          )}

          {/* Tier Reference Cheat Sheet */}
          <div class="bg-slate-850 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-400 space-y-1.5">
            <span class="font-bold text-slate-300 block uppercase tracking-wider text-[10px]">Tier Guidelines</span>
            <div class="flex justify-between"><span>Micro-Parts (&lt; $10):</span> <span class="font-semibold text-slate-300">200% – 400%</span></div>
            <div class="flex justify-between"><span>Tier 1 ($10 – $50):</span> <span class="font-semibold text-slate-300">75% – 100%</span></div>
            <div class="flex justify-between"><span>Tier 2 ($50 – $250):</span> <span class="font-semibold text-slate-300">50% – 60%</span></div>
            <div class="flex justify-between"><span>Tier 3 ($250 – $750):</span> <span class="font-semibold text-slate-300">40% – 50%</span></div>
            <div class="flex justify-between"><span>Tier 4 ($750 – $1,500):</span> <span class="font-semibold text-slate-300">30% – 40%</span></div>
            <div class="flex justify-between"><span>Tier 5 ($1,500+):</span> <span class="font-semibold text-slate-300">25% – 35%</span></div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Calculator />);
  </script>
</body>
</html>
